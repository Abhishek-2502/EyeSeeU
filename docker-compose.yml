version: "3"

services:
  backend:
    build: ./backend
    container_name: eyeseeu-backend
    ports:
      - "5000:5000"  # Exposed only if needed
    restart: always
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: eyeseeu-frontend
    # React app will be built and copied to nginx during nginx build
    restart: always
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"  # Public-facing
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
