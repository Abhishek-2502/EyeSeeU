version: "3"
services:
  backend:
    build: ./backend
    container_name: eyeseeu-backend
    ports:
      - "5000:5000"
    restart: always
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: eyeseeu-frontend
    command: sh -c "npm run build && cp -r build /app/final-build"  # Build and copy
    volumes:
      - ./frontend/final-build:/app/final-build  # Mount the built files
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./frontend/final-build:/usr/share/nginx/html  # Use the built files
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge