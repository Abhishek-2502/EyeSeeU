version: "3"
services:
  backend:
    build: ./backend
    container_name: eyeseeu-backend
    ports:
      - "5000:5000"
    restart: always
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: eyeseeu-frontend
    command: npm run build   # Ensures the frontend is built before nginx access
    networks:
      - app-network
    volumes:
      - ./frontend/build:/app/build  # Ensures the frontend build folder is available for nginx

  nginx:
    build:
      context: .  # Set the build context to the root directory (where frontend folder exists)
      dockerfile: Dockerfile.nginx  # Specify the Dockerfile for nginx
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
